<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>صانع ورقة الامتحان</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#111;font-family:Tahoma,Arial,sans-serif}.top{background:#401b91;color:#fff;padding:18px;text-align:center}.wrap{max-width:1050px;margin:auto;padding:12px}.card,.q{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{font-weight:bold;display:block;margin-bottom:4px}input,textarea,select{width:100%;padding:9px;border:1px solid #ccd2da;border-radius:7px;font:inherit}textarea{min-height:65px}button{border:0;border-radius:7px;padding:9px 13px;font:inherit;font-weight:bold;cursor:pointer}.p{background:#4b20a6;color:#fff}.g{background:#168653;color:#fff}.r{background:#d33;color:#fff}.l{background:#e8ecf1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.qhead{display:flex;justify-content:space-between;align-items:center}.badge{background:#4b20a6;color:#fff;padding:5px 10px;border-radius:20px}.row{display:grid;grid-template-columns:1fr 100px 170px;gap:8px;margin-top:10px}.sub{border-right:4px solid #ddd;background:#fafafa;padding:10px;margin-top:10px}.item{display:grid;grid-template-columns:35px 1fr 32px;gap:6px;margin-top:7px}.preview{display:none}.paper{width:210mm;min-height:297mm;background:#fff;margin:auto;padding:12mm 13mm}.bism{text-align:center;font-size:21px;font-weight:bold}.head{display:grid;grid-template-columns:1fr 1fr 1fr;line-height:1.8;margin:10px 0}.center{text-align:center}.left{text-align:left}.line{border:0;border-top:2px solid #777}.question{font-size:18px;line-height:2;margin:12px 0}.branches.h{display:flex;flex-wrap:wrap;gap:25px}.points.h{display:flex;flex-wrap:wrap;gap:25px}.part{margin-right:35px}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}.paper{width:100%;padding:20px}.head{font-size:13px}.question{font-size:15px}}@media print{.no-print{display:none!important}.preview{display:block!important}.paper{width:210mm;margin:0}}
</style>
</head>
<body>
<div class="top no-print"><h1>صانع ورقة الامتحان</h1><div>أنشئ الأسئلة ورتب الأفرع والنقاط ثم اطبع الورقة</div></div>
<div id="editor" class="wrap no-print">
<div class="card"><h2>بيانات الامتحان</h2><div class="grid">
<div><label>الإدارة</label><input id="admin"></div><div><label>اسم المدرسة</label><input id="school"></div><div><label>الصف</label><input id="stage"></div>
<div><label>العام الدراسي</label><input id="year"></div><div><label>التاريخ</label><input id="date"></div><div><label>اسم المادة</label><input id="subject"></div>
<div><label>مدرس المادة</label><input id="teacher"></div><div style="grid-column:span 2"><label>الملاحظة</label><input id="note"></div>
</div></div>
<div class="card"><h2>الأسئلة</h2><div id="qs"></div><div class="actions"><button class="p" onclick="addQ()">+ إضافة سؤال</button><button class="l" onclick="save()">حفظ</button><button class="l" onclick="load()">استرجاع</button><button class="r" onclick="clearAll()">مسح الكل</button><button class="g" onclick="preview()">معاينة</button></div></div>
</div>
<div id="pv" class="preview"><div class="no-print actions" style="justify-content:center"><button class="g" onclick="window.print()">طباعة / PDF</button><button class="l" onclick="back()">رجوع</button></div><div id="paper" class="paper"></div></div>
<script>
let Q=[],id=1;const $=x=>document.getElementById(x),types=[['normal','سؤال عادي'],['mcq','اختيار من متعدد'],['tf','صح/خطأ'],['fill','املأ الفراغ'],['essay','مقالي'],['match','مزاوجة']];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addQ(){Q.push({id:id++,type:'normal',text:'',mark:'',bd:'v',pd:'v',branches:[],points:[],opts:['','']});render()}
function addB(q){q.branches.push({text:'',points:[]});render()}function addP(q,b){(b==null?q.points:q.branches[b].points).push('');render()}
function delQ(n){Q=Q.filter(q=>q.id!=n);render()}function delB(q,b){q.branches.splice(b,1);render()}function delP(q,i,b){(b==null?q.points:q.branches[b].points).splice(i,1);render()}
function q(n){return Q.find(x=>x.id==n)}
function render(){let z=$('qs');z.innerHTML='';Q.forEach((q,qi)=>{let h='<div class="q"><div class="qhead"><span class="badge">السؤال '+(qi+1)+'</span><button class="r" onclick="delQ('+q.id+')">حذف</button></div><div class="row"><textarea placeholder="نص السؤال" oninput="q('+q.id+').text=this.value">'+esc(q.text)+'</textarea><input placeholder="الدرجة" value="'+esc(q.mark)+'" oninput="q('+q.id+').mark=this.value"><select onchange="q('+q.id+').type=this.value;render()">'+types.map(t=>'<option value="'+t[0]+'" '+(q.type==t[0]?'selected':'')+'>'+t[1]+'</option>').join('')+'</select></div><div class="grid" style="margin-top:8px"><div><label>اتجاه الأفرع</label><select onchange="q('+q.id+').bd=this.value"><option value="v" '+(q.bd=='v'?'selected':'')+'>عمودي</option><option value="h" '+(q.bd=='h'?'selected':'')+'>أفقي</option></select></div><div><label>اتجاه النقاط</label><select onchange="q('+q.id+').pd=this.value"><option value="v" '+(q.pd=='v'?'selected':'')+'>عمودي</option><option value="h" '+(q.pd=='h'?'selected':'')+'>أفقي</option></select></div></div>';
if(q.type=='mcq'){h+='<div class="sub"><b>الخيارات</b>';q.opts.forEach((o,i)=>h+='<div class="item"><b>'+String.fromCharCode(65+i)+')</b><input value="'+esc(o)+'" oninput="q('+q.id+').opts['+i+']=this.value"><button class="r" onclick="q('+q.id+').opts.splice('+i+',1);render()">×</button></div>');h+='<button class="l" onclick="q('+q.id+').opts.push(\\'\\');render()">+ خيار</button></div>'}
h+='<div class="sub"><div class="qhead"><b>الأفرع</b><button class="l" onclick="addB(q('+q.id+'))">+ فرع</button></div>';q.branches.forEach((b,bi)=>{h+='<div class="sub"><div class="qhead"><b>('+String.fromCharCode(65+bi)+')</b><button class="r" onclick="delB(q('+q.id+'),'+bi+')">حذف</button></div><textarea placeholder="نص الفرع" oninput="q('+q.id+').branches['+bi+'].text=this.value">'+esc(b.text)+'</textarea>';b.points.forEach((p,pi)=>h+='<div class="item"><b>('+(pi+1)+')</b><textarea oninput="q('+q.id+').branches['+bi+'].points['+pi+']=this.value">'+esc(p)+'</textarea><button class="r" onclick="delP(q('+q.id+'),'+pi+','+bi+')">×</button></div>');h+='<button class="l" onclick="addP(q('+q.id+'),'+bi+')">+ نقطة</button></div>')});h+='</div><div class="sub"><div class="qhead"><b>النقاط الرئيسية</b><button class="l" onclick="addP(q('+q.id+'))">+ نقطة</button></div>';q.points.forEach((p,i)=>h+='<div class="item"><b>('+(i+1)+')</b><textarea oninput="q('+q.id+').points['+i+']=this.value">'+esc(p)+'</textarea><button class="r" onclick="delP(q('+q.id+'),'+i+')">×</button></div>');h+='</div></div>';z.innerHTML+=h})}
function meta(){let o={};['admin','school','stage','year','date','subject','teacher','note'].forEach(x=>o[x]=$(x).value);return o}
function save(){localStorage.examMaker=JSON.stringify({m:meta(),Q});alert('تم الحفظ')}
function load(){let d=JSON.parse(localStorage.examMaker||'null');if(!d)return alert('ماكو حفظ سابق');Object.entries(d.m).forEach(([k,v])=>$(k).value=v||'');Q=d.Q||[];id=Math.max(0,...Q.map(x=>x.id))+1;render();alert('تم الاسترجاع')}
function clearAll(){if(confirm('تمسح كل الأسئلة؟')){Q=[];render()}}
function preview(){let m=meta(),o='<div class="bism">بسم الله الرحمن الرحيم</div><div class="head"><div><b>'+esc(m.admin)+'</b><br>'+esc(m.school)+'</div><div class="center"><b>'+esc(m.year)+'</b><br>'+esc(m.subject)+'</div><div class="left"><b>'+esc(m.stage)+'</b><br>التاريخ: '+esc(m.date)+'</div></div><div>'+esc(m.note)+'</div><hr class="line">';
Q.forEach((x,i)=>{o+='<div class="question"><b>س'+(i+1)+')</b> '+esc(x.text)+(x.mark?' <small>('+esc(x.mark)+' درجة)</small>':'');if(x.type=='mcq')o+='<div class="branches '+x.bd+'">'+x.opts.filter(Boolean).map((v,j)=>'<div>'+String.fromCharCode(65+j)+') '+esc(v)+'</div>').join('')+'</div>';if(x.type=='tf')o+='<div>☐ صح &nbsp;&nbsp; ☐ خطأ</div>';if(x.type=='fill')o+='<div>________________________</div>';if(x.type=='match')o+='<div>مزاوجة: __________________</div>';o+='<div class="branches '+x.bd+'">'+x.branches.map((b,j)=>'<div><b>('+String.fromCharCode(65+j)+')</b> '+esc(b.text)+(b.points.length?'<div class="points '+x.pd+'">'+b.points.map((p,k)=>'<div class="part">('+(k+1)+') '+esc(p)+'</div>').join('')+'</div>':'')+'</div>').join('')+'</div>';o+='<div class="points '+x.pd+'">'+x.points.map((p,j)=>'<div class="part">('+(j+1)+') '+esc(p)+'</div>').join('')+'</div></div>'});o+='<div style="text-align:center;margin-top:30px">مدرس المادة: '+esc(m.teacher)+'</div>';$('paper').innerHTML=o;$('editor').style.display='none';$('pv').style.display='block'}
function back(){$('pv').style.display='none';$('editor').style.display='block'}addQ();
</script></body></html>
